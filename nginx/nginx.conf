# =============================================================================
# Smart Code Reviewer — nginx Reverse Proxy
# =============================================================================
#
# Architecture:
#   GitHub → nginx :8080 → webhook-service :5001  (primary)
#                        ↘ backend          :5000  (passive failover)
#
# Failover strategy: passive (proxy_next_upstream).
#   If webhook-service returns a connection error, timeout, or 5xx nginx
#   immediately retries the request against backend WITHOUT requiring the
#   client to resend.  This is completely transparent to GitHub.
#
# Both services:
#   - Verify X-Hub-Signature-256 independently (HMAC-SHA256).
#   - Perform duplicate-delivery detection via Redis (X-GitHub-Delivery ID).
#   - Are unaffected by each other's availability.
#
# All webhook headers (X-Hub-Signature-256, X-GitHub-Event, X-GitHub-Delivery)
# are forwarded verbatim — nginx does NOT strip or modify them.
#
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Combined Upstream with Failover Support ──────────────────────────────
    # Try webhook-service:5001 first, and fail over to backend:5000 if it is down.
    upstream webhook_servers {
        server webhook-service:5001 max_fails=2 fail_timeout=10s;
        server backend:5000 max_fails=2 fail_timeout=10s backup;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Server block ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── /api/github/webhook — primary route with failover ─────────────────
        location /api/github/webhook {
            # Try webhook-service first, fallback to backup backend:5000 in same upstream group
            proxy_pass http://webhook_servers;

            # Conditions that trigger a retry on the next upstream:
            #   error   — TCP connection refused / reset
            #   timeout — connect / read / send timeout exceeded
            #   http_502, http_503, http_504 — upstream returned a 5xx gate error
            #   non_idempotent — REQUIRED: allow retry of POST requests.
            #     By default nginx does NOT retry non-idempotent methods (POST).
            #     This is safe here because both services perform X-GitHub-Delivery
            #     deduplication, so an accidental double-delivery is rejected by
            #     whichever service receives the duplicate.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;

            # Allow up to 2 upstream attempts (primary + failover = 2 total)
            proxy_next_upstream_tries 2;

            # Give up on upstream selection after 15 s total
            proxy_next_upstream_timeout 15s;

            # Timeouts for individual upstream connections
            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # ── Forward GitHub webhook headers verbatim ───────────────────────
            # These headers are required by both services for HMAC verification
            # and duplicate-delivery detection.  NEVER strip or rewrite them.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # GitHub-specific headers — forwarded verbatim, never rewritten
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header X-GitHub-Event      $http_x_github_event;
            proxy_set_header X-GitHub-Delivery   $http_x_github_delivery;

            # Raw body must be forwarded intact so HMAC validation succeeds.
            proxy_buffering off;
            proxy_request_buffering on;
        }

        # ── /health — nginx-level health probe ───────────────────────────────
        # Returns 200 immediately.  Used by docker healthcheck and monitoring.
        # Does NOT proxy to any upstream — tests nginx itself, not the services.
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Deny all other paths ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
