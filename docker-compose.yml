# =============================================================================
# Smart Code Reviewer — Customized 3-Container docker-compose.yml
# =============================================================================
# Containers:
#   1. webapp  — Frontend (5173), Backend (5000), and Redis Broker (6379) [Clubbed]
#   2. webhook — Dedicated GitHub Webhook Handler Service (5001) [Isolated]
#   3. agent   — FastAPI Service (5050) & Celery Worker [Isolated]
# =============================================================================

version: "3.9"

networks:
  scr-network:
    driver: bridge

services:

  # ─── 1. Webapp Container (UI + API + Redis Broker) ─────────────────────────
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    ports:
      - "5173:5173"  # Frontend UI
      - "5000:5000"  # Backend API
      - "6379:6379"  # Expose Redis for webhook and agent containers
    env_file:
      - ./backend/.env
    environment:
      # Connect to review-agent internally
      REVIEW_AGENT_URL: http://agent:5050
      # Redis runs locally within the same container
      REDIS_URL: redis://localhost:6379
    networks:
      - scr-network
    depends_on:
      - agent
    restart: unless-stopped

  # ─── 2. Webhook Container (Dedicated Webhook Service) ──────────────────────
  webhook:
    build:
      context: ./webhook-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"  # Webhook receiver port
    env_file:
      - ./webhook-service/.env
    environment:
      # Point to Redis inside the webapp container
      REDIS_URL: redis://webapp:6379
    networks:
      - scr-network
    depends_on:
      - webapp
    restart: unless-stopped

  # ─── 3. Agent Container (FastAPI + Celery Worker) ─────────────────────────
  agent:
    build:
      context: ./review-agent
      dockerfile: Dockerfile
    ports:
      - "5050:5050"  # Expose FastAPI port
    env_file:
      - ./review-agent/.env
    environment:
      PORT: 5050
      # Point to Redis inside the webapp container
      REDIS_URL: redis://webapp:6379/0
    networks:
      - scr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
